name: Enterprise API Test Automation CI/CD

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment (dev, qa, staging)'
        required: true
        default: 'qa'
      suite:
        description: 'Test Suite File'
        required: true
        default: 'testng.xml'

jobs:
  test-automation:
    name: Execute Automated API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Execute Test Automation Suite
        run: |
          mvn clean test -DsuiteXmlFile=${{ github.event.inputs.suite || 'testng.xml' }} -Denv=${{ github.event.inputs.environment || 'qa' }}

      - name: Generate Allure Report
        if: always()
        run: |
          mvn allure:report

      - name: Upload Test Execution Logs & Allure Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-test-report
          path: |
            target/site/allure-maven-plugin
            target/logs/test-execution.log
